<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試卷區 - 科目選擇</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f8f9fa; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #dc3545; margin-bottom: 30px; }
        
        /* 兩兩並排的按鈕網格 */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 25px 15px; font-size: 20px; color: white; text-decoration: none; border-radius: 8px; transition: 0.3s; font-weight: bold; }
        
        /* 各科顏色 */
        .btn-chinese { background-color: #e83e8c; } .btn-chinese:hover { background-color: #c63377; }
        .btn-math { background-color: #007bff; } .btn-math:hover { background-color: #0056b3; }
        .btn-english { background-color: #28a745; } .btn-english:hover { background-color: #1e7e34; }
        .btn-science { background-color: #17a2b8; } .btn-science:hover { background-color: #117a8b; }
        
        /* 無效按鈕的外觀 (建置中) */
        .disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-back { display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .btn-back:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 試卷區 (Exam)</h1>
        <p>請選擇你要複習的科目：</p>
        
        <div class="btn-grid">
            <a href="#" class="btn btn-chinese disabled">國文 (建置中)</a>
            <a href="math.html" class="btn btn-math">📐 數學</a>
            <a href="#" class="btn btn-english disabled">英文 (建置中)</a>
            <a href="#" class="btn btn-science disabled">自然 (建置中)</a>
        </div>

        <a href="https://brucehsu60.github.io/" class="btn-back">🔙 返回總入口</a>
    </div>
</body>
</html>
