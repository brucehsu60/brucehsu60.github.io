<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入口</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        .btn {
            display: inline-block;
            margin: 15px;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        /* 數學：藍色 */
        .btn-math { background-color: #007bff; }
        .btn-math:hover { background-color: #0056b3; }

        /* 英文：綠色 */
        .btn-english { background-color: #28a745; }
        .btn-english:hover { background-color: #1e7e34; }

        /* 自然：青色 */
        .btn-natural { background-color: #17a2b8; }
        .btn-natural:hover { background-color: #117a8b; }

        /* 試卷：紅色 */
        .btn-exam { background-color: #dc3545; }
        .btn-exam:hover { background-color: #c82333; }

        /* 英文釋疑：深青色 */
        .btn-english-help { background-color: #20a4a8; }
        .btn-english-help:hover { background-color: #16777a; }

        /* 中叢：紫色 */
        .btn-series { background-color: #6f42c1; }
        .btn-series:hover { background-color: #56339a; }

        /* 計畫：橘色 */
        .btn-plan { background-color: #fd7e14; }
        .btn-plan:hover { background-color: #e36402; }

        /* 英文釋疑與中叢保持相鄰 */
        .paired-buttons {
            display: inline-flex;
            flex-wrap: nowrap;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px 10px;
            }

            .btn {
                margin: 8px;
                padding: 12px 18px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 入口</h1>
        <p>請選擇你要練習的科目或測驗：</p>

        <a href="https://brucehsu60.github.io/math/"
           class="btn btn-math">數學</a>

        <a href="https://brucehsu60.github.io/English/"
           class="btn btn-english">英文</a>

        <a href="https://brucehsu60.github.io/natural/"
           class="btn btn-natural">自然</a>

        <a href="https://brucehsu60.github.io/Exam/"
           class="btn btn-exam">試卷</a>

        <span class="paired-buttons">
            <a href="brucehsu60.github.io/Exam/english-help.html"
               class="btn btn-english-help">英文釋疑</a>

            <a href="https://brucehsu60.github.io/series/"
               class="btn btn-series">中叢</a>
        </span>

        <a href="https://brucehsu60.github.io/sch/"
           class="btn btn-plan">計畫</a>
    </div>
</body>
</html>
